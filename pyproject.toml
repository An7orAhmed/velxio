[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "velxio"
version = "0.1.0"
description = "Small STM32F401 firmware simulator for the Powerbox sine wave inverter"
requires-python = ">=3.10"
authors = [{name = "Antor Ahmed"}]
dependencies = []

[project.scripts]
velxio = "velxio.cli:main"

[tool.setuptools.package-data]
velxio = ["defaults/*.json", "platforms/*.repl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
