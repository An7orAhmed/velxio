name: Local STM32 Experiment

on:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - backend/app/local_stm32.py
      - backend/tests/test_local_stm32.py
      - backend/app/main.py
      - run.sh
      - .github/workflows/stm32-local-experiment.yml
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash -n run.sh
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest tests.test_local_stm32 -v
        working-directory: backend
